[package]
name = "rust_sui2"
version = "0.1.0"
edition = "2021"

[dependencies]
# https://github.com/MystenLabs/sui/tree/main/crates/sui-sdk
sui_sdk = { git = "https://github.com/mystenlabs/sui", package = "sui-sdk"}
sui_config = { git = "https://github.com/mystenlabs/sui", package = "sui-config"}
sui_move_build = { git = "https://github.com/mystenlabs/sui", package = "sui-move-build"}
tokio = { version = "1.2", features = ["full"] }
anyhow = "1.0"
bcs = "0.1.6"
serde_json = "1.0.1"